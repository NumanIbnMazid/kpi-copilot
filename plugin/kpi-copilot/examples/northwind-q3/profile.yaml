profile_version: "1.0"

# Example profile A - Asana + Google Workspace + automatic push.
# This is the setup the original pipeline was built for, expressed as configuration
# instead of as code. Compare it with examples/acme-jira/profile.yaml: same engine, same
# KPIs, completely different tooling.

owner:
  name: Numan Ibn Mazid
  email: lead@example.com
  role: Software Project Lead
  account: Northwind
  timezone: Asia/Dhaka

organization:
  pms_base_url: https://pms.example.com
  kpi_registry: kpi_registry.json
  note_format: "what is measured || the numbers || what was left out || why"
  evidence_required: true

tools:
  - id: tracker
    kind: issue-tracker
    name: Asana
    url_or_id: https://app.asana.com/0/1100000000000001
    description: "The Northwind boards. Every feature, change request and QA report is a card here, and the card history is what proves a delivery date."
    used_for: [scope, dates, defects, evidence]
    access: Google SSO

  - id: pms
    kind: pms
    name: Enosis PMS
    url_or_id: https://pms.example.com/all-projects/101/kpis
    description: "Where the KPIs are finally recorded and where management reads them."
    used_for: [output]
    access: Enosis SSO

  - id: chat-devqa
    kind: chat
    name: Northwind Dev-QA
    url_or_id: AAAAexampleDevQA
    description: "Day-to-day delivery chatter: build messages, QA rounds, environment problems. Best source for when something actually reached QA."
    used_for: [evidence, dates, handover]
    access: Google SSO

  - id: chat-management
    kind: chat
    name: Northwind-Management
    url_or_id: AAAAexampleMgmt
    description: "Weekly call summaries and client deadlines such as the Q3 feature freeze. This is where an agreed date usually appears first."
    used_for: [dates, evidence]
    access: Google SSO

  - id: plan-pdf
    kind: document
    name: Project Plan (Q3 Release Items)
    url_or_id: https://drive.google.com/file/d/1ExampleProjectPlanFileId00000000/view
    description: "The agreed scope and the original milestone dates. When the board and the plan disagree, the plan is what the client signed."
    used_for: [scope, estimates, dates]
    access: Google Drive

  - id: estimates-sheet
    kind: spreadsheet
    name: Additional Effort Estimates
    url_or_id: 1ExampleEstimatesSheetId0000000000000000000
    description: "Every approved change request with its hours and its approval date. The source of truth for CR Rate."
    used_for: [estimates, scope]
    access: Google Drive

  - id: timeline-sheet
    kind: spreadsheet
    name: Project Timeline and Changelog
    url_or_id: 1ExampleTimelineSheetId00000000000000000000
    description: "Timeline items and the date change log. Shows which dates moved and why."
    used_for: [dates, timeline]
    access: Google Drive

  - id: tracker-workbook
    kind: spreadsheet
    name: KPI Tracker (per project)
    url_or_id: 1ExampleDriveFolderId000000000000
    description: "Drive folder holding one KPI tracker workbook per project, with the evidence links behind every number."
    used_for: [output]
    access: Google Drive

tracker:
  adapter: asana
  project_ref: "1100000000000001"
  url: https://app.asana.com
  estimate_field: Estimated Time
  story_point_field: Story Points
  key_field: TKT

conventions:
  key_pattern: 'TKT-\d+'
  defect_by: title-pattern
  defect_pattern: '^(Bug|Observation|Improvement) ?\d+'
  defect_values: [Bug]
  observation_values: [Observation, Improvement]
  exclude_patterns:
    - '^Milestone\b'
    - '^Checklist\b'
    - '^Bug Reporting$'
    - '^Bug ?fix(ing)?$'
    - '^Regression Testing'
    - '^Acceptance Criteria'
    - '^Environment Setup'
    - '^\[Duplicate\]'
  cr_marker: '\[CR\]'
  client_names:
    - Dana Whitfield
    - Marisa Cole
    - Evan Hollis
    - Jordan Clarke
    - Jamie Moreno
    - Sasha Lindo
    - Stefan Barrow

workflow:
  delivered_when:
    signal: status-entered
    values: [Ready for QA, Testing, Testing Failed, Dev Complete, Closed]
    from_date: "2026-09-10"
    fallback_values: [Dev Complete, Ready for QA]
  closed_when:
    values: [Closed]
    completed_flag_means: "On these boards Asana's own 'complete' means merged, not accepted. Use the Closed column."
  reopened_when:
    values: [In Progress, Testing Failed, Ready for QA]
    ignore_first_qa_fail: true
  clarification_when:
    values: [Awaiting Feedback]
    also_comments: true
    exclude_reasons: [build, environment, access]

sources:
  plan:
    tool_id: plan-pdf
    kind: pdf
    ref: https://drive.google.com/file/d/1ExampleProjectPlanFileId00000000/view
    note: "Every line of the plan is a task row. Bug-fix buckets are not rows - the defect KPIs cover them."
  estimates:
    tool_id: estimates-sheet
    kind: sheet
    ref: 1ExampleEstimatesSheetId0000000000000000000
    note: "Every approved row is a CR row."
  timeline:
    tool_id: timeline-sheet
    kind: sheet
    ref: 1ExampleTimelineSheetId00000000000000000000
    note: "Timeline Items + Date Change Log."
  evidence_channels: [chat-devqa, chat-management]
  hours_first: plan
  hours_basis: dev+qa

periods:
  model: Delivery cycle
  naming: "Initial Scope, Additional Requests N"
  client_check_default: Delivery

policy:
  count_observations: false
  count_improvements: false
  count_pre_existing: false
  count_post_release: true
  count_rejected: false

output:
  mode: assisted-push
  unattended: false
  workbook: google-sheets
  workbook_location: 1ExampleDriveFolderId000000000000
  workbook_template: 1ExampleTemplateSheetId00000000000000000000
  run_folder: runs
  notify: chat-devqa

custom_instructions:
  notes_style: "Two sentences at most. Name the ticket, never the person. Dates as mm/dd."
  always:
    - "Show the previous period next to the new one so a jump is visible."
    - "Flag any KPI that moved more than 20 points since the last run."
  never:
    - "Never post to the client-facing chat space."
    - "Never push to PMS on a Friday after 5pm Dhaka time."
  glossary:
    - "Handover means the build that reached Northwind, not the internal release."
    - "MK = the PartnerSync integration."
  rule_overrides:
    - rule: defect_phase
      value: "Bug 41 = Post-release"
      why: "Steve reported it on 08/20, eight days after the 08/12 handover, so it escaped."
      approved_by: "Numan"
    - rule: cr_denominator
      value: "period"
      why: "Each delivery cycle is quoted and approved separately, so additions belong to their own cycle."
    # A locked setting, left here as a comment to show what happens: uncomment it and both
    # profile_tool.py validate and the engine refuse it, with a sentence explaining why.
    # - rule: threshold_defect_rate
    #   value: "25"
    #   why: "This project is an integration with a lot of legacy surface."
  escalation: "Ask me in chat. If I have not answered by the next working day, hold the run and do not push."

projects:
  - id: q3-release
    name: Northwind Q3 Release Items
    pms_project_id: 101
    tracker_ref: "1100000000000001"
    workbook_ref: 1ExampleTrackerSheetId0000000000000000000000
    plan_ref: https://drive.google.com/file/d/1ExampleProjectPlanFileId00000000/view
    estimates_ref: 1ExampleEstimatesSheetId0000000000000000000
    period_model: Delivery cycle
    velocity_unit: Estimated Hours
    notes: "Q3 feature freeze 09/11; bug fixes allowed until 09/25."
